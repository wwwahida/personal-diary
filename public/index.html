<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Personal Diary</title>
</head>
<body>
    <h1>Welcome to Your Personal Diary</h1>

    <section id="entry-form">
        <h3>New Entry</h3>
        <form id="diary-form">
            <input type="text" id="entry-title" name="title" placeholder="Entry Title" required>
            <textarea id="entry-content" name="description" placeholder="Write your entry here..." rows="5" required></textarea>
            <button type="submit">Add Entry</button>
        </form>
    </section>

    <section id="entries">
        <h3>Your Entries</h3>
        <form id="filter-form">
            <input type="date" id="filter-date" name="filter-date">
            <button type="button" id="filter-button">Filter</button>
        </form>
        <div id="entry-list"></div>
    </section>
</body>
</html>
